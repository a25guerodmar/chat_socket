<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xat en temps real</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenidor">

        <!-- Entrada al chat -->
        <section id="form-entrada-contenidor">
            <h1>Xat en temps real</h1>

            <form id="form-entrada">
                <input
                    type="text"
                    id="nom"
                    placeholder="El teu nom"
                    maxlength="20"
                    required
                >
                <button type="submit">Entrar al xat</button>
            </form>
        </section>

        <!-- Interfície del xat -->
        <section id="chat" hidden>

            <!-- Capçalera -->
            <header class="capcalera">
                <h1>Xat en temps real</h1>
                <p id="nom-usuari"></p>
                <p>Estat: <span id="estat-connexio">Connectant...</span></p>
            </header>

            <!-- Zona de missatges -->
            <div class="zona-missatges">
                <ul id="messages"></ul>
            </div>

            <!-- Formulari per enviar missatges -->
            <form id="form">
                <input
                    type="text"
                    id="text"
                    placeholder="Escriu un missatge"
                    maxlength="500"
                    required
                >
                <button type="submit">Enviar</button>
            </form>

        </section>

    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>

</body>

</html>
